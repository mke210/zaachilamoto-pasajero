<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1A1A2E">
    <title>Zaachila Moto - Pasajero</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        :root {
            --bg-primary: #0F0D15;
            --bg-secondary: #1A1721;
            --bg-card: #211D2A;
            --accent: #6C5CE7;
            --accent-light: #A29BFE;
            --success: #00C897;
            --danger: #FF4757;
            --warning: #FFA502;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-muted: #707070;
            --border: #2D2938;
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 431px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
                background: #0a0a0f;
            }
            .mobile-container {
                border-radius: var(--radius-xl);
                min-height: 92vh;
                max-height: 95vh;
                overflow-y: auto;
                box-shadow: 0 0 60px rgba(108, 92, 231, 0.15);
            }
        }

        /* Header */
        .app-header {
            background: var(--bg-secondary);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-logo {
            width: 38px;
            height: 38px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .header-profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-profile:hover {
            border-color: var(--accent);
        }

        /* Status Bar */
        .status-bar {
            background: var(--bg-secondary);
            padding: 0.6rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }

        .status-dot.offline {
            background: var(--danger);
            animation: none;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Map */
        .map-wrapper {
            height: 320px;
            position: relative;
            border-bottom: 1px solid var(--border);
        }

        #clientMap {
            height: 100%;
            width: 100%;
        }

        .map-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .map-ctrl-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .map-ctrl-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Bottom Sheet */
        .bottom-sheet {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 1.25rem;
            margin-top: -24px;
            position: relative;
            z-index: 10;
            min-height: 280px;
            border: 1px solid var(--border);
            border-bottom: none;
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 1rem;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        /* Input Group */
        .input-group {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.9rem 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .input-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .input-icon.origin {
            background: rgba(108, 92, 231, 0.2);
            color: var(--accent-light);
        }

        .input-icon.destiny {
            background: rgba(255, 71, 87, 0.2);
            color: var(--danger);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        /* Buttons */
        .btn {
            padding: 0.85rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #7B6FE8;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background: #3D3A50;
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: rgba(255, 71, 87, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .btn-danger:hover {
            background: rgba(255, 71, 87, 0.25);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-sm {
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
            border-radius: var(--radius-sm);
            width: auto;
        }

        /* Nearby Drivers */
        .drivers-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .driver-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
        }

        .driver-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #4834d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .driver-info {
            flex: 1;
            min-width: 0;
        }

        .driver-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .driver-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.75rem;
        }

        .driver-status-badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .driver-status-badge.available {
            background: rgba(0, 200, 151, 0.15);
            color: var(--success);
        }

        /* Active Service */
        .active-service-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .driver-detail-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .driver-avatar-lg {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #4834d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .driver-detail-info {
            flex: 1;
        }

        .driver-detail-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .driver-detail-plate {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .driver-detail-rating {
            font-size: 0.8rem;
            color: var(--warning);
        }

        /* Progress Steps */
        .progress-steps {
            display: flex;
            justify-content: space-between;
            margin: 1.25rem 0;
            position: relative;
        }

        .progress-steps::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 25px;
            right: 25px;
            height: 2px;
            background: var(--border);
            z-index: 0;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .step-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .step-circle.active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.4);
        }

        .step-circle.completed {
            background: var(--success);
            border-color: var(--success);
        }

        .step-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Service Info */
        .service-info-box {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 0.85rem;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .info-item {
            font-size: 0.8rem;
        }

        .info-value {
            font-weight: 700;
            color: var(--text-primary);
        }

        .info-label {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 0.85rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-md);
            z-index: 9999;
            font-weight: 600;
            font-size: 0.85rem;
            animation: toastAnim 3s ease forwards;
            pointer-events: none;
            box-shadow: var(--shadow);
        }

        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="header-logo">🏍️</div>
                <div>
                    <div class="header-title">Zaachila Moto</div>
                    <div class="header-subtitle">VIAJE SEGURO</div>
                </div>
            </div>
            <div class="header-profile" onclick="showToast('Perfil de usuario')">
                <i class="fa-solid fa-user"></i>
            </div>
        </header>

        <!-- Status Bar -->
        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Conectando...</span>
        </div>

        <!-- Map -->
        <div class="map-wrapper">
            <div id="clientMap"></div>
            <div class="map-controls">
                <button class="map-ctrl-btn" onclick="centerMapOnUser()" title="Mi ubicación">
                    <i class="fa-solid fa-location-crosshairs"></i>
                </button>
                <button class="map-ctrl-btn" onclick="map.zoomIn()" title="Acercar">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button class="map-ctrl-btn" onclick="map.zoomOut()" title="Alejar">
                    <i class="fa-solid fa-minus"></i>
                </button>
            </div>
        </div>

        <!-- Bottom Sheet - Solicitud -->
        <div class="bottom-sheet" id="requestSheet">
            <div class="sheet-handle"></div>
            
            <div class="section-title">SOLICITAR SERVICIO</div>
            
            <div class="input-group">
                <div class="input-icon origin">
                    <i class="fa-solid fa-circle"></i>
                </div>
                <input type="text" id="pickupInput" placeholder="Tu ubicación actual" readonly>
            </div>

            <div class="input-group">
                <div class="input-icon destiny">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <input type="text" id="destinyInput" placeholder="¿A dónde te dirigirás?">
            </div>

            <button class="btn btn-primary" id="requestBtn" onclick="solicitarServicio()">
                <i class="fa-solid fa-motorcycle"></i>&nbsp; Solicitar Mototaxi
            </button>

            <!-- Choferes cercanos -->
            <div style="margin-top: 1.25rem;">
                <div class="section-title">MOTOTAXIS DISPONIBLES</div>
                <div class="drivers-list" id="nearbyDriversList">
                    <div class="empty-state">
                        <i class="fa-solid fa-motorcycle"></i>
                        <p>Cargando disponibilidad...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Sheet - Servicio Activo -->
        <div class="bottom-sheet" id="activeSheet" style="display:none;">
            <div class="sheet-handle"></div>
            
            <div class="active-service-card">
                <div class="driver-detail-row">
                    <div class="driver-avatar-lg">🏍️</div>
                    <div class="driver-detail-info">
                        <div class="driver-detail-name" id="activeDriverName">---</div>
                        <div class="driver-detail-plate" id="activeDriverPlate">Placa: ---</div>
                        <div class="driver-detail-rating" id="activeDriverRating">⭐ ---</div>
                    </div>
                </div>

                <!-- Progress -->
                <div class="progress-steps">
                    <div class="step-item">
                        <div class="step-circle" id="stepCircle1"><i class="fa-solid fa-motorcycle"></i></div>
                        <span class="step-label">En camino</span>
                    </div>
                    <div class="step-item">
                        <div class="step-circle" id="stepCircle2"><i class="fa-solid fa-person"></i></div>
                        <span class="step-label">Recogida</span>
                    </div>
                    <div class="step-item">
                        <div class="step-circle" id="stepCircle3"><i class="fa-solid fa-flag-checkered"></i></div>
                        <span class="step-label">Destino</span>
                    </div>
                </div>

                <!-- Info -->
                <div class="service-info-box">
                    <div class="info-item">
                        <div class="info-value" id="etaDisplay">---</div>
                        <div class="info-label">Llegada</div>
                    </div>
                    <div class="info-item">
                        <div class="info-value" id="fareDisplay">$0</div>
                        <div class="info-label">Tarifa</div>
                    </div>
                    <div class="info-item">
                        <div class="info-value" id="distanceDisplay">---</div>
                        <div class="info-label">Distancia</div>
                    </div>
                </div>
            </div>

            <!-- Acciones -->
            <button class="btn btn-outline" onclick="abrirChat()" style="margin-bottom:0.5rem;">
                <i class="fa-solid fa-comment"></i>&nbsp; Chat con el chofer
            </button>

            <button class="btn btn-outline" onclick="reportarObjeto()" style="margin-bottom:0.5rem;">
                <i class="fa-solid fa-box"></i>&nbsp; Reportar objeto olvidado
            </button>

            <button class="btn btn-danger" onclick="cancelarServicio()">
                <i class="fa-solid fa-xmark"></i>&nbsp; Cancelar servicio
            </button>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // ========== CONFIGURACIÓN FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyCBXBPMz2OZ3U2KfTaU-uHCBhwmbnR7O40",
            authDomain: "zaachilamoto.firebaseapp.com",
            databaseURL: "https://zaachilamoto-default-rtdb.firebaseio.com",
            projectId: "zaachilamoto",
            storageBucket: "zaachilamoto.firebasestorage.app",
            messagingSenderId: "559788509526",
            appId: "1:559788509526:web:c751d8d22068f09041aef7"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ========== VARIABLES ==========
        let map;
        let userMarker;
        let userLocation = { lat: 16.9516, lng: -96.7491 };
        let userId = null;
        let currentServiceId = null;
        let driversMarkers = [];
        let isConnected = false;

        const VILLA_ZAACHILA = [16.9516, -96.7491];

        // ========== INICIALIZACIÓN ==========
        function init() {
            console.log('🚀 Zaachila Moto Cliente iniciando...');
            
            // Monitorear conexión
            database.ref('.info/connected').on('value', (snap) => {
                isConnected = snap.val() === true;
                updateConnectionStatus();
                if (isConnected) autenticar();
            });

            initMap();
            getCurrentLocation();
        }

        function updateConnectionStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (isConnected) {
                dot.className = 'status-dot';
                text.textContent = 'Conectado al servidor';
            } else {
                dot.className = 'status-dot offline';
                text.textContent = 'Sin conexión';
            }
        }

        function autenticar() {
            auth.signInAnonymously()
                .then((userCredential) => {
                    userId = userCredential.user.uid;
                    console.log('✅ Autenticado:', userId.substring(0, 10) + '...');
                    cargarChoferesCercanos();
                    escucharServicioActivo();
                })
                .catch((error) => {
                    console.error('❌ Error auth:', error);
                });
        }

        function initMap() {
            map = L.map('clientMap', {
                zoomControl: false,
                attributionControl: false
            }).setView(VILLA_ZAACHILA, 15);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© CartoDB'
            }).addTo(map);

            userMarker = L.marker(VILLA_ZAACHILA, {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background:#6C5CE7;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 0 15px rgba(108,92,231,0.6);"></div>',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                })
            }).addTo(map);
        }

        // ========== GEOLOCALIZACIÓN ==========
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        map.setView([userLocation.lat, userLocation.lng], 16);
                        userMarker.setLatLng([userLocation.lat, userLocation.lng]);
                        document.getElementById('pickupInput').value = 'Ubicación actual detectada';
                    },
                    () => {
                        document.getElementById('pickupInput').value = 'Villa de Zaachila, Oaxaca';
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        }

        // ========== CHOFERES CERCANOS ==========
        function cargarChoferesCercanos() {
            database.ref('choferes').orderByChild('estado').equalTo('activo')
                .on('value', (snap) => {
                    const choferes = snap.val();
                    actualizarMarcadores(choferes);
                    actualizarLista(choferes);
                });
        }

        function actualizarMarcadores(choferes) {
            driversMarkers.forEach(m => map.removeLayer(m));
            driversMarkers = [];
            if (!choferes) return;

            Object.entries(choferes).forEach(([id, chofer]) => {
                if (chofer.ubicacion) {
                    const marker = L.marker([chofer.ubicacion.lat, chofer.ubicacion.lng], {
                        icon: L.divIcon({
                            className: 'driver-map-marker',
                            html: '<div style="background:#00C897;color:white;padding:3px 7px;border-radius:12px;font-size:10px;font-weight:700;border:1px solid white;">🏍️</div>',
                            iconSize: [30, 20],
                            iconAnchor: [15, 10]
                        })
                    }).addTo(map);
                    marker.bindPopup(`<b>${chofer.nombre || 'Chofer'}</b><br>⭐ ${chofer.calificacion || 'Nuevo'}`);
                    driversMarkers.push(marker);
                }
            });
        }

        function actualizarLista(choferes) {
            const container = document.getElementById('nearbyDriversList');
            
            if (!choferes || Object.keys(choferes).length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-motorcycle"></i>
                        <p>No hay mototaxis disponibles en este momento</p>
                    </div>`;
                return;
            }

            let html = '';
            Object.entries(choferes).forEach(([id, chofer]) => {
                const distancia = calcularDistancia(
                    userLocation.lat, userLocation.lng,
                    chofer.ubicacion?.lat || VILLA_ZAACHILA[0],
                    chofer.ubicacion?.lng || VILLA_ZAACHILA[1]
                );

                html += `
                    <div class="driver-item">
                        <div class="driver-avatar">🏍️</div>
                        <div class="driver-info">
                            <div class="driver-name">${chofer.nombre || 'Chofer ' + id.substring(0, 6)}</div>
                            <div class="driver-meta">
                                <span>📍 ${distancia.toFixed(1)} km</span>
                                <span>⭐ ${chofer.calificacion || 'Nuevo'}</span>
                            </div>
                        </div>
                        <span class="driver-status-badge available">DISPONIBLE</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ========== SOLICITAR SERVICIO ==========
        function solicitarServicio() {
            const destino = document.getElementById('destinyInput').value.trim();
            
            if (!destino) {
                showToast('⚠️ Indica tu destino para continuar');
                return;
            }

            if (!isConnected) {
                showToast('❌ Sin conexión al servidor');
                return;
            }

            const btn = document.getElementById('requestBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>&nbsp; Buscando...';

            const serviceData = {
                clienteId: userId || 'anon',
                origen: {
                    lat: userLocation.lat,
                    lng: userLocation.lng,
                    direccion: document.getElementById('pickupInput').value
                },
                destino: {
                    lat: userLocation.lat + 0.001,
                    lng: userLocation.lng + 0.001,
                    direccion: destino
                },
                tarifa_estimada: Math.floor(Math.random() * 25) + 30,
                estado: 'buscando',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            const newServiceRef = database.ref('servicios').push();
            currentServiceId = newServiceRef.key;
            
            newServiceRef.set(serviceData)
                .then(() => {
                    console.log('✅ Servicio solicitado:', currentServiceId);
                    
                    // Cambiar a vista de servicio activo
                    document.getElementById('requestSheet').style.display = 'none';
                    document.getElementById('activeSheet').style.display = 'block';
                    
                    escucharMiServicio(currentServiceId);
                    showToast('🔍 Buscando mototaxi cercano...');
                    
                    // Simular aceptación
                    setTimeout(() => simularAceptacion(currentServiceId), 5000);
                })
                .catch((error) => {
                    console.error('❌ Error:', error);
                    showToast('❌ Error al solicitar servicio');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-motorcycle"></i>&nbsp; Solicitar Mototaxi';
                });
        }

        function simularAceptacion(serviceId) {
            database.ref('choferes').orderByChild('estado').equalTo('activo').limitToFirst(1)
                .once('value', (snap) => {
                    let choferData = {
                        choferId: 'default',
                        choferNombre: 'Chofer Zaachila',
                        choferPlaca: '---',
                        choferRating: '4.5'
                    };
                    
                    if (snap.exists()) {
                        const choferes = snap.val();
                        const first = Object.entries(choferes)[0];
                        choferData = {
                            choferId: first[0],
                            choferNombre: first[1].nombre || 'Chofer',
                            choferPlaca: first[1].placa || '---',
                            choferRating: first[1].calificacion || 'Nuevo'
                        };
                    }
                    
                    database.ref(`servicios/${serviceId}`).update({
                        ...choferData,
                        estado: 'aceptado'
                    });
                });
        }

        function escucharMiServicio(serviceId) {
            database.ref(`servicios/${serviceId}`).on('value', (snap) => {
                const servicio = snap.val();
                if (!servicio) return;

                if (servicio.estado === 'aceptado') {
                    document.getElementById('activeDriverName').textContent = servicio.choferNombre || 'Chofer';
                    document.getElementById('activeDriverPlate').textContent = 'Placa: ' + (servicio.choferPlaca || '---');
                    document.getElementById('activeDriverRating').textContent = '⭐ ' + (servicio.choferRating || 'Nuevo');
                    document.getElementById('stepCircle1').classList.add('active');
                    document.getElementById('etaDisplay').textContent = '3-5 min';
                    document.getElementById('fareDisplay').textContent = '$' + (servicio.tarifa_estimada || '40');
                    document.getElementById('distanceDisplay').textContent = '~1 km';
                    showToast('✅ ¡Chofer asignado!');
                } else if (servicio.estado === 'en_camino') {
                    document.getElementById('stepCircle2').classList.add('active');
                } else if (servicio.estado === 'en_servicio') {
                    document.getElementById('stepCircle2').classList.add('completed');
                    document.getElementById('stepCircle3').classList.add('active');
                } else if (servicio.estado === 'completado') {
                    document.getElementById('stepCircle3').classList.add('completed');
                    showToast('✅ ¡Viaje completado!');
                    setTimeout(resetearApp, 5000);
                }
            });
        }

        function escucharServicioActivo() {
            if (!userId) return;
            
            database.ref('servicios').orderByChild('clienteId').equalTo(userId)
                .limitToLast(1)
                .on('child_added', (snap) => {
                    const servicio = snap.val();
                    if (servicio.estado !== 'completado' && servicio.estado !== 'cancelado') {
                        currentServiceId = snap.key;
                        document.getElementById('requestSheet').style.display = 'none';
                        document.getElementById('activeSheet').style.display = 'block';
                        escucharMiServicio(currentServiceId);
                    }
                });
        }

        // ========== CANCELAR SERVICIO ==========
        function cancelarServicio() {
            if (!currentServiceId) return;
            
            if (confirm('¿Estás seguro de cancelar este servicio?')) {
                database.ref(`servicios/${currentServiceId}`).update({
                    estado: 'cancelado',
                    timestamp_cancelacion: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    showToast('❌ Servicio cancelado');
                    resetearApp();
                }).catch((error) => {
                    showToast('❌ Error al cancelar: ' + error.message);
                });
            }
        }

        function resetearApp() {
            currentServiceId = null;
            document.getElementById('requestSheet').style.display = 'block';
            document.getElementById('activeSheet').style.display = 'none';
            document.getElementById('destinyInput').value = '';
            document.getElementById('requestBtn').disabled = false;
            document.getElementById('requestBtn').innerHTML = '<i class="fa-solid fa-motorcycle"></i>&nbsp; Solicitar Mototaxi';
            
            // Resetear steps
            document.querySelectorAll('.step-circle').forEach(el => {
                el.classList.remove('active', 'completed');
            });
        }

        // ========== CHAT ==========
        function abrirChat() {
            const msg = prompt('💬 Mensaje para el chofer:');
            if (msg && currentServiceId) {
                database.ref(`chats/${currentServiceId}`).push({
                    remitente: 'cliente',
                    userId: userId,
                    mensaje: msg,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).then(() => showToast('✅ Mensaje enviado'));
            }
        }

        // ========== REPORTAR OBJETO ==========
        function reportarObjeto() {
            const desc = prompt('📦 Describe el objeto que olvidaste:');
            if (desc && currentServiceId) {
                database.ref('reportes/objetos_olvidados').push({
                    servicioId: currentServiceId,
                    clienteId: userId,
                    descripcion: desc,
                    estado: 'pendiente',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).then(() => showToast('✅ Reporte enviado'));
            }
        }

        // ========== UTILIDADES ==========
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) ** 2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function centerMapOnUser() {
            map.setView([userLocation.lat, userLocation.lng], 16);
        }

        function showToast(mensaje) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ========== INICIAR ==========
        window.addEventListener('DOMContentLoaded', init);
        console.log('🏍️ Zaachila Moto - Cliente Profesional Listo');
    </script>
</body>
</html>
