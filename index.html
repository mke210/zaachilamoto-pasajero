<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Zaachila Moto</title>
    
    <!-- Icono integrado -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%236C5CE7'/><text x='50' y='65' text-anchor='middle' font-size='45'>🛺</text></svg>">
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Zaachila Moto">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%236C5CE7'/><text x='50' y='65' text-anchor='middle' font-size='45'>🛺</text></svg>">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root{--bg:#0a0a0f;--bg2:#13111a;--card:#1a1722;--acc:#6C5CE7;--green:#00C897;--red:#FF4757;--warn:#FFA502;--txt:#fff;--txt2:#aaa;--txt3:#666;--bd:#252130;--r:12px;--r2:18px}
        *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
        body{font-family:'Inter','Segoe UI',sans-serif;background:#000;color:var(--txt)}
        .app{max-width:430px;margin:0 auto;height:100vh;background:var(--bg);display:flex;flex-direction:column}
        @media(min-width:431px){body{display:flex;justify-content:center;align-items:center;padding:20px}.app{border-radius:30px;height:90vh;max-height:800px;box-shadow:0 0 50px rgba(108,92,231,.1)}}
        .topbar{background:var(--bg2);padding:.5rem .8rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);flex-shrink:0;z-index:10}
        .topbar h1{font-size:.9rem}.topbar h1 span{color:var(--acc)}
        .status{font-size:.6rem;display:flex;align-items:center;gap:.3rem;color:var(--txt2)}
        .status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}.status.off::before{background:var(--red)}
        .map-container{flex:0 0 250px;position:relative;z-index:1}
        #clientMap{position:absolute;top:0;left:0;width:100%;height:100%}
        .map-btns{position:absolute;top:10px;right:10px;z-index:5;display:flex;flex-direction:column;gap:4px}
        .map-btns button{width:30px;height:30px;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--txt);cursor:pointer;font-size:.7rem}
        .sheet{background:var(--bg2);border-radius:var(--r2) var(--r2) 0 0;padding:.7rem .9rem;border:1px solid var(--bd);border-bottom:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
        .sheet-handle{width:30px;height:3px;background:var(--bd);border-radius:2px;margin:0 auto .5rem}
        .inp-group{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem .7rem;margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem}
        .inp-group i{font-size:.7rem;width:16px;text-align:center}.inp-group input{flex:1;background:0;border:0;color:var(--txt);font-size:.8rem;outline:0}.inp-group input::placeholder{color:var(--txt3)}
        .btn{width:100%;padding:.6rem;border-radius:var(--r);font-weight:700;font-size:.8rem;cursor:pointer;border:0;margin-top:.3rem;transition:.2s}
        .btn-p{background:var(--acc);color:#fff}.btn-p:disabled{opacity:.4}
        .btn-o{background:0;border:1px solid var(--bd);color:var(--txt2)}
        .btn-r{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.3)}
        .d-item{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
        .d-avatar{width:32px;height:32px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
        .d-info{flex:1}.d-name{font-size:.75rem;font-weight:600}.d-meta{font-size:.6rem;color:var(--txt3)}
        .d-badge{font-size:.55rem;padding:.15rem .4rem;border-radius:8px;background:rgba(0,200,151,.1);color:var(--green);font-weight:700}
        .steps{display:flex;gap:.3rem;margin:.5rem 0}
        .step{flex:1;text-align:center;padding:.4rem;background:var(--bg2);border-radius:var(--r);border:1px solid var(--bd);font-size:.6rem}
        .step.on{border-color:var(--acc);background:rgba(108,92,231,.1)}.step.done{border-color:var(--green)}.step .sn{font-size:.8rem;font-weight:700}
        .info-row{display:flex;justify-content:space-around;text-align:center;margin:.5rem 0}
        .info-row .v{font-weight:700;font-size:.8rem}.info-row .l{font-size:.55rem;color:var(--txt3)}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:999;display:flex;align-items:center;justify-content:center}
        .modal-box{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:1.2rem;width:90%;max-width:340px;text-align:center}
        .modal-box .price{font-size:2rem;font-weight:800;color:var(--acc);margin:.4rem 0}
        .driver-detail-box{background:var(--card);border-radius:var(--r);padding:.6rem;margin:.5rem 0;text-align:left;font-size:.7rem;line-height:1.7}
        .driver-detail-box div{display:flex;align-items:center;gap:.4rem}
        .color-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}
        .chat-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:999;display:flex;flex-direction:column}
        .chat-header{background:var(--bg2);padding:.6rem .9rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
        .chat-body{flex:1;overflow-y:auto;padding:.7rem;display:flex;flex-direction:column;gap:.4rem}
        .msg{max-width:80%;padding:.5rem .6rem;border-radius:12px;font-size:.7rem}
        .msg.sent{background:var(--acc);align-self:flex-end}.msg.recv{background:var(--card);align-self:flex-start;border:1px solid var(--bd)}
        .chat-input-wrap{padding:.5rem;display:flex;gap:.3rem;border-top:1px solid var(--bd);background:var(--bg2)}
        .chat-input-wrap input{flex:1;padding:.5rem;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);color:var(--txt);outline:0;font-size:.75rem}
        .chat-input-wrap button{padding:.5rem .8rem;background:var(--acc);color:#fff;border:0;border-radius:var(--r);font-weight:700;cursor:pointer}
        .stars{display:flex;justify-content:center;gap:.3rem;margin:.8rem 0}
        .stars span{font-size:2rem;cursor:pointer;color:var(--bd);transition:.2s}.stars span.sel{color:var(--warn)}
        .toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);padding:.5rem .8rem;border-radius:var(--r);z-index:9999;font-size:.7rem;font-weight:600;animation:ti 2.5s ease forwards;pointer-events:none}
        @keyframes ti{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
        .empty{text-align:center;color:var(--txt3);padding:1rem;font-size:.75rem}
        .badge-new{background:var(--red);color:#fff;padding:2px 6px;border-radius:10px;font-size:.55rem;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    </style>
</head>
<body>
<div class="app">
    <header class="topbar"><h1>🛺 Zaachila <span>Moto</span></h1><div class="status" id="connStatus">Conectado</div></header>
    <div class="map-container"><div id="clientMap"></div><div class="map-btns"><button onclick="centerMap()"><i class="fa-solid fa-location-crosshairs"></i></button><button onclick="map.zoomIn()">+</button><button onclick="map.zoomOut()">-</button></div></div>
    <div class="sheet" id="requestSheet">
        <div class="sheet-handle"></div>
        <div class="inp-group"><i class="fa-solid fa-circle" style="color:var(--green)"></i><input id="pickup" placeholder="Tu ubicación" readonly></div>
        <div class="inp-group"><i class="fa-solid fa-location-dot" style="color:var(--red)"></i><input id="destiny" placeholder="¿A dónde vas?"></div>
        <button class="btn btn-p" id="reqBtn" onclick="requestRide()">Solicitar Mototaxi</button>
        <div style="margin-top:.8rem"><h4 style="font-size:.65rem;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-bottom:.4rem">Disponibles</h4><div id="driversList"><div class="empty">Cargando...</div></div></div>
    </div>
    <div class="sheet" id="activeSheet" style="display:none">
        <div class="sheet-handle"></div>
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem"><div style="width:36px;height:36px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:1rem">🛺</div><div><div style="font-weight:700;font-size:.8rem" id="aName">---</div><div style="font-size:.6rem;color:var(--txt2)" id="aPlate">---</div></div></div>
        <div class="steps"><div class="step on" id="s1"><div class="sn">1</div>En camino</div><div class="step" id="s2"><div class="sn">2</div>Recogida</div><div class="step" id="s3"><div class="sn">3</div>Destino</div></div>
        <div class="info-row"><div><div class="v" id="iEta">---</div><div class="l">Llegada</div></div><div><div class="v" id="iFare">$0</div><div class="l">Tarifa</div></div><div><div class="v" id="iDist">---</div><div class="l">Distancia</div></div></div>
        <button class="btn btn-o" onclick="openChat()">💬 Chat <span id="chatBadge" class="badge-new" style="display:none">Nuevo</span></button>
        <button class="btn btn-r" onclick="cancel()">Cancelar servicio</button>
    </div>
</div>
<script>
const fb={apiKey:"AIzaSyCBXBPMz2OZ3U2KfTaU-uHCBhwmbnR7O40",authDomain:"zaachilamoto.firebaseapp.com",databaseURL:"https://zaachilamoto-default-rtdb.firebaseio.com",projectId:"zaachilamoto",storageBucket:"zaachilamoto.firebasestorage.app",messagingSenderId:"559788509526",appId:"1:559788509526:web:c751d8d22068f09041aef7"};
firebase.initializeApp(fb);const auth=firebase.auth(),db=firebase.database();
let map,um,uid,sid,pos={lat:16.9516,lng:-96.7491},drM=[],chatOpen=false,rating=0,rated=false,vChId=null;const ZA=[16.9516,-96.7491];
db.ref('.info/connected').on('value',s=>{const el=document.getElementById('connStatus');if(s.val()){el.className='status';el.textContent='Conectado';auth.signInAnonymously().then(u=>{uid=u.user.uid;loadDrivers();listenActive()}).catch(e=>console.error(e))}else{el.className='status off';el.textContent='Sin conexión'}});
function initMap(){setTimeout(()=>{const c=document.getElementById('clientMap');if(!c||c.offsetHeight===0)c.style.height='250px';map=L.map('clientMap',{zoomControl:false,attributionControl:false}).setView(ZA,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);um=L.marker(ZA,{icon:L.divIcon({html:'<div style="background:#6C5CE7;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 15px rgba(108,92,231,.6);"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);setTimeout(()=>map.invalidateSize(),300)},500)}
function getLoc(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};if(um)um.setLatLng([pos.lat,pos.lng]);if(map)map.setView([pos.lat,pos.lng],16);document.getElementById('pickup').value='Ubicación actual'},()=>document.getElementById('pickup').value='Villa de Zaachila',{enableHighAccuracy:true})}
function centerMap(){if(map)map.setView([pos.lat,pos.lng],16)}
function loadDrivers(){db.ref('choferes').orderByChild('estado').equalTo('activo').on('value',s=>{const d=s.val();drM.forEach(m=>map.removeLayer(m));drM=[];let h='';if(!d||!Object.keys(d).length){document.getElementById('driversList').innerHTML='<div class="empty">Sin disponibles</div>';return}Object.entries(d).forEach(([id,c])=>{if(c.ubicacion&&map){const m=L.marker([c.ubicacion.lat,c.ubicacion.lng],{icon:L.divIcon({html:'<div style="background:#00C897;color:#000;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:700">🛺</div>',iconSize:[26,16],iconAnchor:[13,8]})}).addTo(map);drM.push(m)}const dist=calcDist(pos.lat,pos.lng,c.ubicacion?.lat||ZA[0],c.ubicacion?.lng||ZA[1]);h+=`<div class="d-item"><div class="d-avatar">🛺</div><div class="d-info"><div class="d-name">${c.nombre||'Chofer'}</div><div class="d-meta">📍${dist.toFixed(1)}km · ⭐${c.calificacion||'Nuevo'}</div></div><span class="d-badge">DISP</span></div>`});document.getElementById('driversList').innerHTML=h})}
function requestRide(){const dest=document.getElementById('destiny').value.trim();if(!dest){toast('Indica tu destino');return}const btn=document.getElementById('reqBtn');btn.disabled=true;btn.textContent='Buscando...';const data={clienteId:uid,origen:{lat:pos.lat,lng:pos.lng,direccion:document.getElementById('pickup').value},destino:{lat:pos.lat+.001,lng:pos.lng+.001,direccion:dest},estado:'buscando',timestamp:firebase.database.ServerValue.TIMESTAMP};const ref=db.ref('servicios').push();sid=ref.key;ref.set(data).then(()=>{document.getElementById('requestSheet').style.display='none';document.getElementById('activeSheet').style.display='block';listenService(sid)}).catch(()=>{btn.disabled=false;btn.textContent='Solicitar Mototaxi'})}
function listenService(id){db.ref(`servicios/${id}`).on('value',s=>{const v=s.val();if(!v)return;if(v.choferId)vChId=v.choferId;if(v.estado==='tarifa_propuesta'){document.getElementById('aName').textContent=v.choferNombre||'Chofer';document.getElementById('aPlate').textContent=(v.choferColor||'')+' · '+v.choferPlaca+' · U.'+(v.choferUnidad||'---');document.getElementById('iFare').textContent='$'+(v.tarifa_propuesta||'0');showFare(id,v)}else if(v.estado==='aceptado'){document.getElementById('s1').classList.add('on');document.getElementById('iEta').textContent='3-5 min';document.getElementById('iDist').textContent='~1 km';toast('✅ Chofer en camino')}else if(v.estado==='en_camino'){document.getElementById('s1').classList.add('done');document.getElementById('s2').classList.add('on')}else if(v.estado==='en_servicio'){document.getElementById('s2').classList.add('done');document.getElementById('s3').classList.add('on')}else if(v.estado==='completado'){document.getElementById('s3').classList.add('done');toast('✅ Completado');showRating(id,v)}else if(v.estado==='cancelado'||v.estado==='rechazado'){toast('No disponible');reset()}});db.ref(`chats/${id}`).on('child_added',snap=>{const m=snap.val();if(m.remitente==='chofer'&&!chatOpen){document.getElementById('chatBadge').style.display='inline-block';playSound('msg');if(navigator.vibrate)navigator.vibrate(80)}})}
function listenActive(){if(!uid)return;db.ref('servicios').orderByChild('clienteId').equalTo(uid).limitToLast(1).on('child_added',s=>{const v=s.val();if(v.estado!=='completado'&&v.estado!=='cancelado'){sid=s.key;document.getElementById('requestSheet').style.display='none';document.getElementById('activeSheet').style.display='block';listenService(sid)}})}
function showFare(id,v){if(document.querySelector('.modal-overlay'))return;document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());const fare=v.tarifa_propuesta||'0';const color=v.choferColor||'No especificado';const colorHex=getColorHex(color);const m=document.createElement('div');m.className='modal-overlay';m.id='fareModal';m.innerHTML=`<div class="modal-box"><div style="font-size:2.5rem">🛺</div><h3>${v.choferNombre||'Chofer'}</h3><div class="driver-detail-box"><div><span class="color-dot" style="background:${colorHex}"></span><b>Color:</b> ${color}</div><div>📋 <b>Placa:</b> ${v.choferPlaca||'---'}</div><div>🔢 <b>Unidad:</b> ${v.choferUnidad||'---'}</div><div>📱 <b>Tel:</b> ${v.choferTelefono||'---'}</div><div>⭐ <b>Calif:</b> ${v.choferRating||'Nuevo'}</div></div><div class="price">$${fare}<span style="font-size:.7rem;color:var(--txt2)"> MXN</span></div><p style="font-size:.6rem;color:var(--warn);margin:.3rem 0">El chofer propone esta tarifa. ¿Aceptas?</p><button class="btn btn-p" id="btnOk">✅ Aceptar tarifa</button><button class="btn btn-r" id="btnNo" style="margin-top:.3rem">❌ Rechazar</button></div>`;document.body.appendChild(m);m.querySelector('#btnOk').onclick=()=>{m.remove();db.ref(`servicios/${id}`).update({estado:'aceptado',cliente_acepta_tarifa:true,ts:firebase.database.ServerValue.TIMESTAMP})};m.querySelector('#btnNo').onclick=()=>{m.remove();db.ref(`servicios/${id}`).update({estado:'cancelado',motivo:'Cliente rechazó'});toast('Cancelado');reset()}}
function getColorHex(c){const colors={rojo:'#FF4757',azul:'#3B82F6',verde:'#00C897',negro:'#333',blanco:'#FFF',gris:'#888',amarillo:'#FFA502',naranja:'#FF6B35',rosa:'#FF6B81',morado:'#6C5CE7'};return colors[(c||'').toLowerCase()]||'#FFF'}
function showRating(id,v){if(rated)return;rated=true;document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());db.ref(`servicios/${id}`).off();const m=document.createElement('div');m.className='modal-overlay';m.id='ratingModal';m.innerHTML=`<div class="modal-box"><div style="font-size:2.5rem">⭐</div><h3>Califica tu viaje</h3><p style="font-size:.7rem;color:var(--txt2);margin:.3rem 0">${v.choferNombre||'Chofer'}<br>${v.choferPlaca||''}</p><div class="stars" id="stars"><span onclick="setR(1)">☆</span><span onclick="setR(2)">☆</span><span onclick="setR(3)">☆</span><span onclick="setR(4)">☆</span><span onclick="setR(5)">☆</span></div><textarea id="rateCm" placeholder="Comentario" style="width:100%;padding:.5rem;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);color:var(--txt);font-size:.7rem;outline:0;margin:.5rem 0;resize:none;font-family:inherit" rows="2"></textarea><button class="btn btn-p" onclick="sendR('${id}')">✅ Enviar</button><button class="btn btn-r" onclick="skipR()" style="margin-top:.3rem">Omitir</button></div>`;document.body.appendChild(m);window.setR=function(r){rating=r;document.querySelectorAll('#stars span').forEach((s,i)=>{s.textContent=i<r?'★':'☆';s.style.color=i<r?'var(--warn)':'var(--bd)'})}}
window.sendR=function(id){if(rating===0){const s=document.getElementById('stars');if(s){s.style.animation='shake .5s ease';setTimeout(()=>s.style.animation='',500)}return}const cm=document.getElementById('rateCm')?.value||'';const md=document.getElementById('ratingModal');db.ref(`servicios/${id}/calificacion`).set({puntuacion:rating,comentario:cm,timestamp:firebase.database.ServerValue.TIMESTAMP}).then(()=>{if(vChId){db.ref(`choferes/${vChId}`).once('value',sn=>{const c=sn.val()||{};const t=c.total_servicios||0;const ca=c.calificacion||0;db.ref(`choferes/${vChId}`).update({calificacion:Math.round(((ca*t)+rating)/(t+1)*10)/10})})}if(md)md.remove();rated=false;rating=0;toast('⭐ Gracias');reset()})}
window.skipR=function(){const m=document.getElementById('ratingModal');if(m)m.remove();rated=false;rating=0;toast('Omitido');reset()}
function openChat(){if(!sid)return;document.getElementById('chatBadge').style.display='none';chatOpen=true;const d=document.createElement('div');d.className='chat-modal';d.innerHTML=`<div class="chat-header"><span>💬 Chat</span><button onclick="this.closest('.chat-modal').remove();chatOpen=false" style="background:none;border:none;color:var(--txt);font-size:1.2rem;cursor:pointer">✕</button></div><div class="chat-body" id="chatMsgs"></div><div class="chat-input-wrap"><input type="text" id="chatInput" placeholder="Escribe..." onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">Enviar</button></div>`;document.body.appendChild(d);db.ref(`chats/${sid}`).on('child_added',s=>{const m=s.val();const el=document.getElementById('chatMsgs');if(el){el.innerHTML+=`<div class="msg ${m.remitente==='cliente'?'sent':'recv'}">${m.mensaje}</div>`;el.scrollTop=el.scrollHeight}})}
window.sendMsg=function(){const i=document.getElementById('chatInput');const m=i?.value.trim();if(m&&sid){db.ref(`chats/${sid}`).push({remitente:'cliente',userId:uid,mensaje:m,ts:firebase.database.ServerValue.TIMESTAMP});i.value=''}}
function cancel(){if(!sid)return;if(confirm('¿Cancelar?')){db.ref(`servicios/${sid}`).update({estado:'cancelado',ts:firebase.database.ServerValue.TIMESTAMP});reset();toast('Cancelado')}}
function reset(){sid=null;rating=0;rated=false;vChId=null;document.getElementById('requestSheet').style.display='block';document.getElementById('activeSheet').style.display='none';document.getElementById('destiny').value='';document.getElementById('reqBtn').disabled=false;document.getElementById('reqBtn').textContent='Solicitar Mototaxi';document.querySelectorAll('.step').forEach(s=>s.className='step');document.getElementById('s1').classList.add('on')}
function playSound(t){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=t==='msg'?1000:600;g.gain.value=.15;o.start();o.stop(c.currentTime+.1)}catch(e){}}
function calcDist(l1,l2,lo1,lo2){const R=6371,dLa=(l2-l1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;return R*2*Math.atan2(Math.sqrt(Math.sin(dLa/2)**2+Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLo/2)**2),Math.sqrt(1-Math.sin(dLa/2)**2-Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dLo/2)**2))}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
window.addEventListener('DOMContentLoaded',()=>{initMap();getLoc()});
window.addEventListener('resize',()=>{if(map)setTimeout(()=>map.invalidateSize(),200)});
